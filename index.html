<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PTSMP Screenshot Viewer</title>
    <script src="config.js"></script>
    <script src="index.js"></script>
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" type="image/png" href="https://ibb.co/6cjh0xsn">
  </head>
  <body>
    <div class="notifications"></div>
    <nav>
      <div class="bar">
      </div>
      <h1>PTSMP Screenshot Viewer</h1>
      <div class="bar">
        <select id="category-select" aria-label="Choose a channel category">
          <option value="">Loading categories...</option>
        </select>
        <select id="channel-select" aria-label="Choose a channel">
          <option value="">Choose a category first</option>
        </select>
      </div>
    </nav>
    <div id="display"></div>
    <div class="image-end" id="image-end" hidden>
      You reached the end of the image gallery.
    </div>
    <div id="expanded-image-bg">
      <div id="expanded-image">
        <div class="top-bar">
          <img src="" alt="" id="author-pfp" />
          <span id="author-username"></span>
          <span id="creation-date"></span>
        </div>
        <div class="carousel-stage">
          <button type="button" class="carousel-arrow" id="previous-image" aria-label="Previous image" title="Previous image">&#8592;</button>
          <img src="" alt="" id="expanded-img" />
          <button type="button" class="carousel-arrow" id="next-image" aria-label="Next image" title="Next image">&#8594;</button>
        </div>
        <span id="image-position" aria-live="polite"></span>
        <div class="btm-bar">
          <div class="left">
            <span id="image-filename"></span>
            <span id="original-image-size"></span>
          </div>
          <div class="right">
            <button id="original-link">Open original</button>
            <button id="message-link">Open message</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
